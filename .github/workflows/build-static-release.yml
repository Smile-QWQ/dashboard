name: Build and Release Static Files

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download IronRDP release TS files
        uses: robinraju/release-downloader@v1.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          latest: true
          fileName: "*.ts"
          out-file-path: public/ironrdp-pkg

      - name: Download IronRDP release JS files
        uses: robinraju/release-downloader@v1.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          latest: true
          fileName: "*.js"
          out-file-path: public/ironrdp-pkg

      - name: Download IronRDP release WASM file
        uses: robinraju/release-downloader@v1.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          latest: true
          fileName: ironrdp_web_bg.wasm
          out-file-path: public/ironrdp-pkg

      - name: Build static files
        run: npm run build

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          timestamp="$(date -u +'%Y%m%d-%H%M%S')"
          version="${timestamp}-${short_sha}"
          archive_name="dashboard-static-${version}.tar.gz"
          checksum_name="${archive_name}.sha256"
          tag_name="static-${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"
          echo "checksum_name=${checksum_name}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

      - name: Archive static files
        shell: bash
        run: |
          tar -czf "${{ steps.meta.outputs.archive_name }}" -C out .
          sha256sum "${{ steps.meta.outputs.archive_name }}" > "${{ steps.meta.outputs.checksum_name }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-static-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.meta.outputs.archive_name }}
            ${{ steps.meta.outputs.checksum_name }}
          if-no-files-found: error

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.meta.outputs.archive_name }}
            ${{ steps.meta.outputs.checksum_name }}
          name: Dashboard Static ${{ steps.meta.outputs.version }}
          tag_name: ${{ steps.meta.outputs.tag_name }}
          body: |
            Automated static build for commit `${{ github.sha }}`.

            Contents:
            - `out/` static export
            - default runtime `config.json`
            - production-ready directory-style routes
            - sha256 checksum file
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
